name: Android regression checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'ai/**'
      - 'search/**'
      - 'speech/**'
      - 'terminal/**'
      - 'workspace/**'
      - 'plugin-localdata/**'
      - 'video/**'
      - 'reading/**'
      - 'web/**'
      - 'web-ui/**'
      - 'plugins/**'
      - 'deploy/**'
      - 'functions/**'
      - 'gradle/**'
      - 'tools/**'
      - '.github/workflows/android-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-regression-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Check web-ui types, functions syntax, and host suites
        run: |
          set -euo pipefail
          pnpm --dir web-ui run typecheck
          node --check functions/index.js
          node --test plugins/image-atelier/tests/references.test.cjs
          node --test plugins/local-moments/tests/*.test.cjs
          node --test deploy/listen/test/listen.test.js deploy/listen/test/netease.test.js
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test regressions and compile device tests
        run: bash gradlew -I .github/gradle/robolectric-ci.gradle :plugin-localdata:testDebugUnitTest :video:testDebugUnitTest :reading:testDebugUnitTest :app:testDebugUnitTest :ai:testDebugUnitTest :speech:testDebugUnitTest :search:testDebugUnitTest :workspace:testDebugUnitTest :terminal:testDebugUnitTest :app:compileDebugAndroidTestKotlin
      - name: Build debug APK
        run: bash gradlew :app:assembleDebug -PorangechatAbis=arm64-v8a -PorangechatUniversalApk=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-regression-results
          path: |
            plugin-localdata/build/reports/tests/
            video/build/reports/tests/
            reading/build/reports/tests/
            app/build/reports/tests/
            ai/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
          retention-days: 7
