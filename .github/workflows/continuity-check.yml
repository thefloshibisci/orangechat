name: Continuity Check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/haven-continuity

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Test recent continuity
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.mcp.RecentContinuityTest
