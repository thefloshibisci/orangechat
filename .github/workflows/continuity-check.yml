name: Continuity Check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/haven-continuity

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Test recent continuity
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.mcp.RecentContinuityTest

      - name: Prepare signed app build
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$KEY_BASE64"
          test -n "$SIGNING_CONFIG"
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build signed continuity APK
        run: ./gradlew assembleRelease

      - name: Upload continuity APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-continuity-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
