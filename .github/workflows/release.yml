name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run web-ui typecheck and host test suites
        run: |
          set -euo pipefail
          pnpm --dir web-ui run typecheck
          node --check functions/index.js
          node --test plugins/image-atelier/tests/references.test.cjs
          node --test plugins/local-moments/tests/*.test.cjs
          node --test deploy/listen/test/listen.test.js deploy/listen/test/netease.test.js
          python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Run Android unit tests
        run: |
          chmod +x gradlew
          ./gradlew -I .github/gradle/robolectric-ci.gradle :plugin-localdata:testDebugUnitTest :video:testDebugUnitTest :reading:testDebugUnitTest :app:testDebugUnitTest :ai:testDebugUnitTest :search:testDebugUnitTest :speech:testDebugUnitTest :workspace:testDebugUnitTest :terminal:testDebugUnitTest

      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_BASE64" | base64 -d > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify bundled OCR in release APK
        run: |
          set -euo pipefail
          python3 tools/verify_bundled_ocr.py app/build/outputs/apk/release/*.apk

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk

      - name: Cleanup build secrets
        if: always()
        run: rm -f app/app.key local.properties app/google-services.json
