name: Build Personal APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4
      - name: Download color utilities
        run: git submodule update --init --depth 1 material3/material-color-utilities

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Allow Gradle to run
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            # 仓库原有签名（与 Release 构建一致），debug 构建也会自动套用 release signingConfig
            echo "$KEY_BASE64" | base64 -d > app/app.key
            echo "$SIGNING_CONFIG" > local.properties
            echo "Signing with repository keystore (app.key + local.properties)"
          elif [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
            echo "Signing with ANDROID_DEBUG_KEYSTORE_BASE64"
          elif [ -f app/debug.keystore ]; then
            echo "Using committed app/debug.keystore"
          else
            echo "No signing config found; generating a local debug keystore." >&2
            keytool -genkeypair -keystore app/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Test search provider construction and serialization
        run: ./gradlew :search:testDebugUnitTest --tests me.rerere.search.SearchServiceOptionsTest

      - name: Test search settings storage round trip
        run: ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.datastore.SearchServicesSettingsTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrangeChat-personal
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
